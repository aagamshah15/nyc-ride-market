# Policy dates used for period labels (SPEC §3.3, §4.1). Seeded by L00.
# L10 (Policy studies) adds the excluded holiday weeks for the congestion effect (SPEC §6).

congestion_pricing_start: 2025-01-05   # MTA Congestion Relief Zone toll begins
driver_pay_inflation_step: 2025-03-01  # TLC annual CPI-W step: per-minute minimum +3.92% (D28)
driver_pay_rise: 2025-08-01            # TLC minimum-pay rule: per-mile floor down, per-minute floor up (D28)
fees:
  cbd_fee_hvfhv: 1.50                  # per trip, peak and overnight
  cbd_fee_taxi: 0.75                   # yellow and green, per trip

# BEGIN excluded_holiday_weeks: written by `python -m pipeline.studies --holidays` (lane L10). Don't edit by hand.
# 2025 ISO weeks left out of the congestion effect (SPEC §6): each US federal holiday that
# falls in different ISO weeks in 2024 and 2025 removes both weeks. sql/metrics/cp_effect.sql
# and cp_effect_summary.sql mirror this list; tests/test_cp_effect.py checks they match.
excluded_holiday_weeks:
  - iso_week: 3
    holiday: "Martin Luther King Jr. Day"
    reason: "Martin Luther King Jr. Day is in ISO week 3 in 2024 (Mon 15 Jan) and week 4 in 2025 (Mon 20 Jan)"
  - iso_week: 4
    holiday: "Martin Luther King Jr. Day"
    reason: "Martin Luther King Jr. Day is in ISO week 3 in 2024 (Mon 15 Jan) and week 4 in 2025 (Mon 20 Jan)"
# END excluded_holiday_weeks
