# Data sources (SPEC §3). Seeded by L00; owned by L02 (Ingest).
# URL pattern and latest month checked 22 Oct 2026 on the TLC Trip Record Data page.

trip_url: "https://d37ci6vzurychx.cloudfront.net/trip-data/{dataset}_tripdata_{month}.parquet"
datasets: [fhvhv, yellow, green]   # non-high-volume FHV is out of scope for v1

months:            # v1 scope (D2); back-fill to 2019-02 comes in Phase 6
  from: "2024-01"
  to: "2026-08"    # latest TLC month on 22 Oct 2026; TLC posts with about a two-month lag

# Lookup and context files, saved under data/ref/ with these names.
ref:
  taxi_zone_lookup.csv: "https://d37ci6vzurychx.cloudfront.net/misc/taxi_zone_lookup.csv"
  taxi_zones.zip: "https://d37ci6vzurychx.cloudfront.net/misc/taxi_zones.zip"
  # TLC monthly indicators from NYC Open Data ("TLC Industry Indicators", v6kb-cqej), saved
  # unchanged (D19). SPEC §3.2's nyc.gov copy answers 403 to non-browser clients. This copy's
  # first column is "Year/Month", not "Month/Year".
  data_reports_monthly.csv: "https://data.cityofnewyork.us/api/views/v6kb-cqej/rows.csv?accessType=DOWNLOAD"

# How pipeline/ingest.py downloads. Retries cover 5xx, 429, dropped connections and short
# reads; a 403 or 404 means the file isn't posted and fails at once.
download:
  attempts: 5         # tries per file
  backoff_s: 2        # wait 2, 4, 8, 16 s between tries
  timeout_s: 60       # connect and per-read timeout
  user_agent: "nyc-ride-market/0.1 (+https://github.com/aagamshah15/nyc-ride-market)"

# Tie-out against the TLC monthly indicators (SPEC §8; D25, D27). Only FHV - High Volume gates
# the check (D27); Yellow and Green are reported with their own pass/fail.
# Vendors whose cab records are subtracted before comparing (D25 mechanism). Empty since D27:
# vendor 6 matched green's gap in 2025-03 only by coincidence.
tie_out_exclude_vendors:
  yellow: []
  green: []

# Month × class rows reported with their reason but not gating (D27). Remove one if TLC revises it.
tie_out_exceptions:
  - month: "2026-06"
    license_class: "FHV - High Volume"
    reason: "TLC reports 707,670 trips a day, but its published file (unchanged since 17 Sep 2026) holds 20,775,868 rows, 692,529 a day"

# High-volume license codes → mode (SPEC §3.3). An unknown code is an error in clean.
hv_license:
  HV0003: uber
  HV0005: lyft
  HV0002: other_hv   # Juno
  HV0004: other_hv   # Via
